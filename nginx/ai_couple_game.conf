server
{
    listen 443 ssl;
    http2 on;
    ssl_certificate     /etc/letsencrypt/live/game.leich.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/game.leich.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;
    add_header Strict-Transport-Security "max-age=31536000" always;
    include /www/server/panel/vhost/nginx/saltline-sec.conf;
    server_name game.leich.cn;
    index index.html index.htm default.htm default.html;
    root /www/wwwroot/couple-game;
    #CERT-APPLY-CHECK--START
    # 用于SSL证书申请时的文件验证相关配置 -- 请勿删除
    include /www/server/panel/vhost/nginx/well-known/couple_game.conf;
    #CERT-APPLY-CHECK--END

    #SSL-START SSL相关配置
    #error_page 404/404.html;
    
    #SSL-END

    # 禁止访问的敏感文件
    location ~* (\.user.ini|\.htaccess|\.htpasswd|\.env.*|\.project|\.bashrc|\.bash_profile|\.bash_logout|\.DS_Store|\.gitignore|\.gitattributes|LICENSE|README\.md|CLAUDE\.md|CHANGELOG\.md|CHANGELOG|CONTRIBUTING\.md|TODO\.md|FAQ\.md|composer\.json|composer\.lock|package(-lock)?\.json|yarn\.lock|pnpm-lock\.yaml|\.\w+~|\.swp|\.swo|\.bak(up)?|\.old|\.tmp|\.temp|\.log|\.sql(\.gz)?|docker-compose\.yml|docker\.env|Dockerfile|\.csproj|\.sln|Cargo\.toml|Cargo\.lock|go\.mod|go\.sum|phpunit\.xml|phpunit\.xml|pom\.xml|build\.gradl|pyproject\.toml|requirements\.txt|application(-\w+)?\.(ya?ml|properties)|ai_config\.json)$
    {
        return 404;
    }

    # 禁止访问的敏感目录
    location ~* /(\.git|\.svn|\.bzr|\.vscode|\.claude|\.idea|\.ssh|\.github|\.npm|\.yarn|\.pnpm|\.cache|\.husky|\.turbo|\.next|\.nuxt|node_modules|runtime|\.aiproject)/ {
        return 404;
    }

    #一键申请SSL证书验证目录相关设置
    location /.well-known/ {
        root /www/wwwroot/java_node_ssl;
    }

    #禁止在证书验证目录放入敏感文件
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    # ACME HTTP-01 校验（Let's Encrypt 续期依赖）
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/saltline;
        default_type text/plain;
        try_files $uri =404;
    }

    # Saltline 管理后台（Ant Design 单页）
    location /admin/ {
        alias /www/wwwroot/saltline-admin/dist/;
        index index.html;
        include /www/server/panel/vhost/nginx/saltline-sec.conf;
        add_header Cache-Control "no-store" always;
    }

    # Saltline 账号 / 大厅世界频道 API（Node 127.0.0.1:7801）
    location /api/ {
        proxy_pass http://127.0.0.1:7801;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
    }

    # Saltline 简体中文版（单文件 WebGL 静态游戏）
    location /saltline/ {
        alias /www/wwwroot/saltline/;
        index index.html;
        include /www/server/panel/vhost/nginx/saltline-sec.conf;
        add_header Cache-Control "public, max-age=300" always;
    }

    # 站点根：Saltline（简体中文版）。原情侣游戏文件仍完整保留在 /www/wwwroot/couple-game
    location / {
        root /www/wwwroot/saltline;
        try_files $uri $uri/ =404;
        include /www/server/panel/vhost/nginx/saltline-sec.conf;
        add_header Cache-Control "public, max-age=60" always;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:7801;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location = /auth.js {
        root /www/wwwroot/saltline;
        include /www/server/panel/vhost/nginx/saltline-sec.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    error_page 404 /404.html;
    location = /404.html { root /www/wwwroot/saltline; internal; }

    access_log  /www/wwwlogs/ai/couple_game.log;
    error_log  /www/wwwlogs/ai/couple_game.error.log;
}

# 80 → 443 跳转（保留 ACME 校验）
server {
    listen 80;
    server_name game.leich.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/saltline;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
